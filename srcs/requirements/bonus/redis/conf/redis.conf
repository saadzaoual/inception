# Redis configuration for the WordPress object cache.

# Listen on every interface: the only clients are other containers on the
# inception bridge network. No port is published to the host.
bind 0.0.0.0
protected-mode no
port 6379

# Cache sizing and eviction. allkeys-lru lets Redis discard the least
# recently used keys once maxmemory is reached, instead of returning errors
# when it fills up - this is what makes it behave as a cache rather than a
# database.
maxmemory 256mb
maxmemory-policy allkeys-lru

# This is a cache: nothing here needs to outlive the container, so both
# persistence mechanisms are disabled. That is also why the service has no
# volume - a cache that is rebuilt from MariaDB on demand has nothing worth
# persisting.
save ""
appendonly no

# Never detach: the container's PID 1 has to be the server itself so that
# signals and the restart policy work.
daemonize no

# Log to stdout so `docker logs redis` shows something.
logfile ""
dir /tmp
