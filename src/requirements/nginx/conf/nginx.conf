server {
    # Listen on port 443 for IPv4 and IPv6 connections with SSL active
    listen 443 ssl;
    listen [::]:443 ssl;

    # Set your domain name (replace login with your actual 42 login)
    server_name szaoual.42.fr;

    # Specify SSL protocol versions required by the subject guidelines
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Define the root folder and index priority
    root /var/www/html;
    index index.php index.html index.htm;

    # Route for static files or standard endpoints
    location / {
        try_files $uri $uri/ =404;
    }

    # Direct any requests ending in .php over to your WordPress container
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Points to the container name 'wordpress' on its listening port
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        
        # Inform PHP-FPM where to locate the script files inside its container
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}